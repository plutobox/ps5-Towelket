name: PS5 native title

# The native PS5 title (eboot.bin), as the PS5 homebrew catalog installs it.
#
# The catalog's versioning rules (docs/versioning.md in
# darkxex/ps5-homebrew-catalog): contentVersion in sce_sys/param.json is
# NN.NNN.NNN, rises with every release, and the release tag is that value.
# ps5/content-version.py enforces them.
#
# - Every push to ps5: build <TITLE_ID>.zip and keep it as a CI artifact.
# - Run it by hand on ps5 with "release" set to patch, minor or major: raise
#   contentVersion, build from that, then commit the bump, tag it with the new
#   version and publish the release, in that order, so a failed build leaves
#   nothing behind. "current" releases the committed contentVersion as it is
#   (the first release, or after raising it by hand).
# - A tag pushed by hand, equal to contentVersion: publish its release.
#
# A release's only asset is the zip, as the catalog requires, and an existing
# release is never changed: a listed asset's sha256 must not change.
on:
  push:
    branches: [ps5]
    tags: ['[0-9][0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release, raising contentVersion by this part
        type: choice
        options: [none, patch, minor, major, current]
        default: none
      notes:
        description: >-
          Release notes (Markdown). Leave empty to list commits since the last release.
        type: string
        default: ''

permissions:
  contents: read

# Serialize builds and releases so publication cannot be interrupted.
concurrency:
  group: ps5-native-${{ github.repository }}
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Every tag, to compare versions and list the commits since the last.
          fetch-depth: 0
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache clang-18 cmake curl git libclang-rt-18-dev \
            lld-18 llvm-18 make ninja-build pkg-config python3 tar unzip \
            wget zip

      - name: Choose the version
        # sce_sys/param.json is the committed copy the catalog reads; the
        # build uses the same title ID and content version.
        env:
          RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release || 'none' }}
        run: |
          title_id=$(python3 -c \
            'import json; print(json.load(open("sce_sys/param.json"))["titleId"])')
          echo "TITLE_ID=$title_id" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=$(python3 ps5/content-version.py current)
            [[ "$GITHUB_REF_NAME" == "$version" ]] || {
              echo "::error::tag $GITHUB_REF_NAME does not match contentVersion $version"
              exit 1
            }
            python3 ps5/content-version.py check "$version"
            echo "RELEASE_TAG=$version" >> "$GITHUB_ENV"
          elif [[ "$RELEASE" != none ]]; then
            [[ "$GITHUB_REF" == refs/heads/ps5 ]] || {
              echo "::error::release from the ps5 branch, not $GITHUB_REF"
              exit 1
            }
            version=$(python3 ps5/content-version.py bump "$RELEASE")
            echo "RELEASE_TAG=$version" >> "$GITHUB_ENV"
            echo "::notice::releasing contentVersion $version"
          else
            version=$(python3 ps5/content-version.py current)
          fi
          echo "CONTENT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Cache pinned dependencies
        uses: actions/cache@v4
        with:
          path: |
            ps5/.deps
            ps5/deps
            ps5/toolchain/boilerplate/.deps
          key: >-
            native-${{ runner.os }}-${{ runner.arch }}-clang18-${{
            hashFiles('ps5/setup-native.sh', 'ps5/fetch-deps.sh',
            'ps5/toolchain/boilerplate/tools/**', 'ps5/toolchain/boilerplate/tooling/**') }}

      - name: Set up the native toolchain
        run: bash ps5/setup-native.sh

      - name: Build and package the title
        working-directory: ps5
        run: |
          bash fetch-deps.sh
          make -f Makefile.native -j"$(nproc)"
          bash package-native.sh --build
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "build-ps5/app/dist/$TITLE_ID.zip" "$GITHUB_WORKSPACE/dist/"
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum "$TITLE_ID.zip" | tee SHA256SUMS)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TITLE_ID }}-${{ env.CONTENT_VERSION }}
          path: dist/
          if-no-files-found: error

      - name: Write release notes
        if: env.RELEASE_TAG != ''
        env:
          NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.notes || '' }}
        # The catalog shows these as the app's release notes: what changed
        # first, short headings and bullet lists, no images or links.
        run: |
          previous=$(git tag --list '[0-9][0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]' \
            --sort=-v:refname \
            | grep -vx "$RELEASE_TAG" | head -n 1 || true)
          {
            if [[ -n "$NOTES" ]]; then
              printf '%s\n' "$NOTES"
            elif [[ -n "$previous" ]]; then
              echo "## Changes since $previous"
              echo
              git log --no-merges --format='- %s' "$previous..HEAD"
            else
              echo "## First release"
              echo
              echo "- Towelket as a native PS5 title ($TITLE_ID), played with the DualSense."
            fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Commit and tag the new version
        if: env.RELEASE_TAG != '' && github.ref_type != 'tag'
        # Pushes made with the workflow's token start no other workflow, so
        # this neither rebuilds itself nor replaces the nightly payload.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- sce_sys/param.json; then
            git commit -q -m "PS5 native: contentVersion $RELEASE_TAG" -- sce_sys/param.json
          fi
          git tag -a "$RELEASE_TAG" -m "Towelket for PS5 $RELEASE_TAG"
          # Atomic: if ps5 moved during the build, neither the bump nor the
          # tag lands, and nothing is released.
          git push --atomic origin "HEAD:refs/heads/ps5" "refs/tags/$RELEASE_TAG"

      - name: Publish release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::release $RELEASE_TAG already exists; leaving it unchanged"
            exit 0
          fi
          gh release create "$RELEASE_TAG" "dist/$TITLE_ID.zip" \
            --verify-tag \
            --title "Towelket for PS5 $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
